<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="description" content="BOBY CREATOR STUDIO — Social Media Management Command Center">
<title>BOBY CREATOR STUDIO 3.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
.dark body{background:#0b1220;color:#e5e7eb}.dark .surface{background:#111c2e!important;border-color:#263449!important;color:#e5e7eb}
.dark .muted{color:#a7b3c5!important}.dark input,.dark select,.dark textarea{background:#0f1a2b!important;color:#f8fafc!important;border-color:#334155!important}
.dark table thead{background:#172438!important}.dark table td{border-color:#263449!important}
.nav-active{background:#3730a3;color:#fff}.nav-item{color:#cbd5e1}.nav-item:hover{background:#263449;color:#fff}
.surface{background:#fff;border:1px solid #e5eaf2;border-radius:18px;box-shadow:0 5px 20px rgba(15,23,42,.035)}
.field{width:100%;border:1px solid #dbe2ec;border-radius:11px;padding:10px 12px;background:#fff;color:#172033;font-size:13px;outline:none}
.field:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:11px;font-size:12px;font-weight:750;transition:.18s}
.btn-primary{background:#4f46e5;color:#fff}.btn-primary:hover{background:#4338ca}
.btn-soft{background:#eef2ff;color:#4338ca}.btn-danger{background:#fff1f2;color:#be123c}
.btn-dark{background:#172033;color:white}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:800}
th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;background:#f8fafc;padding:13px;text-align:left;white-space:nowrap}
td{font-size:12px;padding:13px;border-top:1px solid #edf0f5;vertical-align:middle}
.modal-backdrop{background:rgba(2,6,23,.62);backdrop-filter:blur(5px)}
@media print{aside,header,.no-print,.toolbar{display:none!important}main{padding:0!important;margin:0!important}.surface{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="min-h-screen">
<aside class="hidden lg:flex fixed inset-y-0 left-0 w-64 bg-slate-950 text-white flex-col z-30">
 <div class="p-5 border-b border-slate-800">
  <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center"><i data-lucide="sparkles"></i></div><div><div class="font-black text-sm tracking-tight">BOBY CREATOR</div><div class="text-[10px] text-slate-400">STUDIO 3.0 · COMMAND CENTER</div></div></div>
 </div>
 <nav id="sidebarNav" class="p-3 space-y-1 flex-1 overflow-y-auto"></nav>
 <div class="p-4 border-t border-slate-800"><div class="text-[10px] text-slate-400">PENYIMPANAN</div><div id="storageStatus" class="text-xs font-bold text-emerald-300 mt-1">● Tersimpan di perangkat</div><p class="text-[10px] text-slate-500 mt-1">Backup rutin dianjurkan.</p></div>
</aside>
<div class="lg:ml-64 min-h-screen">
<header class="sticky top-0 z-20 bg-white/90 dark:bg-slate-950/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 md:px-7 py-3 flex items-center justify-between">
 <div class="flex items-center gap-3"><button class="lg:hidden p-2 rounded-lg bg-slate-100 text-slate-700" onclick="toggleMobileNav()"><i data-lucide="menu"></i></button><div><h1 id="pageTitle" class="font-black text-base md:text-lg">Dashboard</h1><p id="pageSub" class="text-[11px] text-slate-500">Ringkasan aktivitas creator dan bisnis</p></div></div>
 <div class="flex items-center gap-2"><span id="todayLabel" class="hidden sm:block text-[11px] text-slate-500"></span><button class="btn btn-soft" onclick="toggleTheme()" title="Mode gelap/terang"><i data-lucide="moon" class="w-4 h-4"></i></button><button class="btn btn-dark" onclick="openQuickAdd()"><i data-lucide="plus" class="w-4 h-4"></i><span class="hidden sm:inline">Tambah Data</span></button></div>
</header>
<div id="mobileNav" class="hidden lg:hidden bg-slate-950 p-3 grid grid-cols-2 gap-1"></div>
<main class="p-4 md:p-7 max-w-[1500px] mx-auto">
 <section id="view"></section>
</main>
</div>
</div>
<div id="modalRoot"></div>
<div id="toast" class="fixed bottom-5 right-5 z-[100] hidden bg-slate-950 text-white px-4 py-3 rounded-xl shadow-xl text-xs"></div>
<script>
const DBKEY='boby_creator_studio_v3';
const modules={
 dashboard:{label:'Dashboard',icon:'layout-dashboard',sub:'Ringkasan aktivitas creator dan bisnis'},
 clients:{label:'Manajemen Klien',icon:'briefcase-business',sub:'Kelola brand, klien, dan kerja sama'},
 accounts:{label:'Akun Media Sosial',icon:'share-2',sub:'Daftar akun dan perkembangan followers'},
 planner:{label:'Content Planner',icon:'calendar-days',sub:'Rencana, produksi, dan publikasi konten'},
 analytics:{label:'Social Media Analytics',icon:'chart-no-axes-combined',sub:'Pantau performa konten dan engagement'},
 affiliate:{label:'Affiliate Tracker',icon:'shopping-bag',sub:'Klik, pesanan, GMV, dan komisi'},
 finance:{label:'Finance & Profit',icon:'wallet',sub:'Pendapatan, piutang, dan pengeluaran'},
 tasks:{label:'Task Management',icon:'list-checks',sub:'Daftar pekerjaan dan deadline'},
 assets:{label:'Asset & Approval',icon:'folder-kanban',sub:'Link aset, materi, dan persetujuan'},
 reports:{label:'Report Center',icon:'file-spreadsheet',sub:'Rekap dan ekspor laporan'},
 settings:{label:'Backup & Pengaturan',icon:'settings',sub:'Cadangkan, pulihkan, dan kelola preferensi'}
};
const schemas={
 clients:{title:'Klien / Brand',fields:[['name','Nama klien','text',true],['contact','Kontak / PIC','text'],['email','Email','email'],['service','Layanan','text'],['fee','Nilai kerja sama (Rp)','number'],['status','Status','select',['Aktif','Prospek','Selesai']],['notes','Catatan','textarea']]},
 accounts:{title:'Akun Media Sosial',fields:[['name','Nama akun / username','text',true],['platform','Platform','select',['TikTok','Instagram','YouTube','Facebook','Shopee','Lainnya']],['client','Klien terkait','text'],['url','Link akun','url'],['followers','Followers','number'],['status','Status','select',['Aktif','Nonaktif']],['notes','Catatan','textarea']]},
 planner:{title:'Rencana Konten',fields:[['date','Tanggal publikasi','date',true],['title','Judul konten','text',true],['platform','Platform','select',['TikTok','Instagram','YouTube','Facebook','Shopee']],['client','Klien / proyek','text'],['format','Format konten','select',['Video pendek','Carousel / Foto','Story','Live Streaming','Video panjang']],['status','Status produksi','select',['Ide','Brief','Produksi','Editing','Review','Terjadwal','Terbit']],['hook','Hook','text'],['caption','Caption','textarea'],['link','Link konten','url']]},
 analytics:{title:'Data Performa Konten',fields:[['date','Tanggal upload','date',true],['title','Nama konten','text',true],['platform','Platform','select',['TikTok','Instagram','YouTube','Facebook','Shopee']],['client','Klien','text'],['views','Views','number'],['reach','Reach','number'],['likes','Likes','number'],['comments','Comments','number'],['shares','Shares','number'],['saves','Saves','number'],['followers','Followers bertambah','number']]},
 affiliate:{title:'Produk Affiliate',fields:[['date','Tanggal','date',true],['product','Nama produk','text',true],['platform','Platform','select',['Shopee','TikTok Shop','Instagram / Lainnya']],['link','Link affiliate','url'],['clicks','Klik','number'],['orders','Pesanan','number'],['gmv','GMV (Rp)','number'],['commission','Komisi estimasi (Rp)','number'],['actual','Komisi cair (Rp)','number']]},
 finance:{title:'Transaksi Keuangan',fields:[['date','Tanggal','date',true],['title','Deskripsi transaksi','text',true],['type','Jenis transaksi','select',['Pendapatan Klien','Komisi Affiliate','Pengeluaran']],['client','Klien / kategori','text'],['amount','Nominal (Rp)','number',true],['status','Status pembayaran','select',['Lunas','Belum Dibayar']]]},
 tasks:{title:'Pekerjaan / Tugas',fields:[['title','Nama pekerjaan','text',true],['deadline','Deadline','date',true],['priority','Prioritas','select',['Tinggi','Sedang','Rendah']],['status','Status','select',['Belum Dikerjakan','Sedang Dikerjakan','Selesai']],['notes','Catatan','textarea']]},
 assets:{title:'Asset & Approval',fields:[['title','Nama aset / materi','text',true],['client','Klien','text'],['type','Jenis','select',['Video','Foto','Brief','Dokumen','Link lainnya']],['url','Link Google Drive / aset','url'],['approval','Status approval','select',['Menunggu','Disetujui','Revisi']],['notes','Catatan','textarea']]}
};
let state=loadDB(),active='dashboard',chart=null;
function loadDB(){try{return Object.assign({clients:[],accounts:[],planner:[],analytics:[],affiliate:[],finance:[],tasks:[],assets:[]},JSON.parse(localStorage.getItem(DBKEY)||'{}'))}catch(e){return {clients:[],accounts:[],planner:[],analytics:[],affiliate:[],finance:[],tasks:[],assets:[]}}}
function persist(){localStorage.setItem(DBKEY,JSON.stringify(state));$('storageStatus').textContent='● Tersimpan di perangkat';}
function $(id){return document.getElementById(id)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function num(n){return Number(n||0).toLocaleString('id-ID')}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),2600)}
function navHTML(){return Object.entries(modules).map(([k,m])=>`<button onclick="go('${k}')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left text-xs font-bold ${active===k?'nav-active':''}"><i data-lucide="${m.icon}" class="w-4 h-4"></i>${m.label}</button>`).join('')}
function refreshNav(){$('sidebarNav').innerHTML=navHTML();$('mobileNav').innerHTML=navHTML();if(window.lucide)lucide.createIcons()}
function go(k){active=k;$('pageTitle').textContent=modules[k].label;$('pageSub').textContent=modules[k].sub;$('mobileNav').classList.add('hidden');render();refreshNav();window.scrollTo({top:0,behavior:'smooth'})}
function toggleMobileNav(){$('mobileNav').classList.toggle('hidden')}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('boby_theme',document.documentElement.classList.contains('dark')?'dark':'light')}
function render(){if(active==='dashboard')renderDashboard();else if(active==='settings')renderSettings();else if(active==='reports')renderReports();else renderModule(active);if(window.lucide)lucide.createIcons()}
function card(label,value,icon,color='indigo',sub=''){return `<div class="surface p-4"><div class="flex items-start justify-between"><div><p class="text-xs text-slate-500 muted font-semibold">${label}</p><div class="text-2xl font-black mt-2">${value}</div><p class="text-[10px] text-slate-400 mt-1">${sub}</p></div><div class="w-10 h-10 rounded-xl bg-${color}-50 text-${color}-600 grid place-items-center"><i data-lucide="${icon}"></i></div></div></div>`}
function renderDashboard(){
 const views=state.analytics.reduce((a,x)=>a+ +x.views,0), reach=state.analytics.reduce((a,x)=>a+ +x.reach,0),eng=state.analytics.reduce((a,x)=>a+ +x.likes + +x.comments + +x.shares + +x.saves,0);
 const paid=state.finance.filter(x=>x.status==='Lunas'&&x.type!=='Pengeluaran').reduce((a,x)=>a+ +x.amount,0),expense=state.finance.filter(x=>x.type==='Pengeluaran').reduce((a,x)=>a+ +x.amount,0);
 const overdue=state.tasks.filter(x=>x.status!=='Selesai'&&x.deadline&&x.deadline<today()).length;
 $('view').innerHTML=`<div class="rounded-2xl p-6 md:p-8 text-white bg-gradient-to-br from-slate-950 via-indigo-950 to-violet-950 mb-5"><div class="flex flex-col md:flex-row md:items-center justify-between gap-5"><div><span class="pill bg-indigo-500/20 text-indigo-200">CREATOR COMMAND CENTER · 3.0</span><h2 class="text-2xl md:text-3xl font-black mt-3">Halo, Creator! 👋</h2><p class="text-sm text-slate-300 mt-2">Kelola konten, klien, performa, affiliate, dan keuangan dalam satu tempat.</p></div><div class="flex gap-2 flex-wrap"><button class="btn bg-white text-indigo-900" onclick="go('planner');openForm('planner')">＋ Buat Konten</button><button class="btn bg-white/10 border border-white/20 text-white" onclick="go('analytics');openForm('analytics')">Input Analitik</button></div></div></div>
 <div class="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-5">${card('Total Klien',state.clients.length,'briefcase-business')}${card('Akun Dikelola',state.accounts.length,'share-2','violet')}${card('Konten Direncanakan',state.planner.length,'calendar-days','sky')}${card('Total Views',num(views),'eye','cyan')}${card('Engagement',num(eng),'heart','rose')}${card('Produk Affiliate',state.affiliate.length,'shopping-bag','amber')}${card('Pendapatan Lunas',money(paid),'wallet','emerald')}${card('Deadline Terlambat',overdue,'alarm-clock','rose')}</div>
 <div class="grid xl:grid-cols-3 gap-4"><div class="surface p-5 xl:col-span-2"><div class="flex justify-between items-center mb-4"><div><h3 class="font-black">Performa Konten</h3><p class="text-xs text-slate-500 muted">Total views berdasarkan data analitik</p></div><button class="btn btn-soft" onclick="go('analytics')">Lihat detail</button></div><div class="h-64"><canvas id="dashChart"></canvas></div></div><div class="surface p-5"><h3 class="font-black mb-3">Aktivitas Berikutnya</h3>${state.tasks.filter(x=>x.status!=='Selesai').sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||'')).slice(0,6).map(t=>`<div class="py-3 border-b border-slate-100 dark:border-slate-700"><div class="font-bold text-xs">${esc(t.title)}</div><div class="text-[10px] text-slate-500 mt-1">${esc(t.deadline||'-')} · ${esc(t.status)}</div></div>`).join('')||'<p class="text-xs text-slate-400 py-5">Belum ada tugas aktif.</p>'}<button class="btn btn-soft w-full mt-4" onclick="go('tasks')">Buka Task Management</button></div></div>`;
 if(window.lucide)lucide.createIcons();const ctx=$('dashChart');if(chart)chart.destroy();chart=new Chart(ctx,{type:'bar',data:{labels:state.analytics.slice(-8).map(x=>x.title.slice(0,16)),datasets:[{label:'Views',data:state.analytics.slice(-8).map(x=>+x.views||0),backgroundColor:'#6366f1',borderRadius:7}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
}
function renderModule(k){
 const s=schemas[k],items=state[k]||[];
 const rows=items.map(x=>`<tr>${s.fields.slice(0,Math.min(s.fields.length,6)).map(f=>`<td>${formatCell(f[0],x[f[0]])}</td>`).join('')}<td class="text-right whitespace-nowrap"><button class="btn btn-soft !p-2" onclick="openForm('${k}','${x.id}')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button> <button class="btn btn-danger !p-2" onclick="removeItem('${k}','${x.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></td></tr>`).join('');
 $('view').innerHTML=`<div class="surface p-4 md:p-5 mb-4"><div class="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h2 class="font-black text-lg">${s.title}</h2><p class="text-xs text-slate-500 muted mt-1">${items.length} data tersimpan · gunakan pencarian untuk menemukan data</p></div><button class="btn btn-primary" onclick="openForm('${k}')"><i data-lucide="plus" class="w-4 h-4"></i> Tambah ${s.title}</button></div><div class="mt-4"><input id="tableSearch" class="field max-w-md" placeholder="Cari data..." oninput="filterRows()"></div></div>
 <div class="surface overflow-hidden"><div class="overflow-x-auto"><table class="w-full"><thead><tr>${s.fields.slice(0,Math.min(s.fields.length,6)).map(f=>`<th>${f[1]}</th>`).join('')}<th class="text-right">Aksi</th></tr></thead><tbody id="dataRows">${rows||`<tr><td colspan="10" class="text-center py-12"><div class="font-bold text-slate-500">Belum ada data</div><p class="text-xs text-slate-400 mt-1">Klik tombol Tambah untuk mulai mencatat.</p></td></tr>`}</tbody></table></div></div>`;
 if(window.lucide)lucide.createIcons();
}
function formatCell(key,v){if(v===undefined||v===null||v==='')return '<span class="text-slate-300">—</span>';if(['fee','amount','gmv','commission','actual'].includes(key))return `<span class="font-bold">${money(v)}</span>`;if(['views','reach','likes','comments','shares','saves','followers','clicks','orders'].includes(key))return num(v);if(key==='status'||key==='approval')return `<span class="pill bg-indigo-50 text-indigo-700">${esc(v)}</span>`;if(key==='url'||key==='link')return `<a class="text-indigo-600 underline" href="${esc(v)}" target="_blank" rel="noopener">Buka link</a>`;return esc(v)}
function filterRows(){const q=$('tableSearch').value.toLowerCase();document.querySelectorAll('#dataRows tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function openForm(k,id=''){const s=schemas[k],old=(state[k]||[]).find(x=>x.id===id)||{};const fields=s.fields.map(f=>{const [key,label,type,required,opts]=f;let val=old[key]??(type==='date'?today():'');let input=type==='textarea'?`<textarea class="field" name="${key}" rows="3">${esc(val)}</textarea>`:type==='select'?`<select class="field" name="${key}">${opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="field" name="${key}" type="${type}" ${type==='number'?'min="0"':''} value="${esc(val)}" ${required===true?'required':''}>`;return `<label class="block"><span class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">${label}${required===true?' *':''}</span>${input}</label>`}).join('');
 $('modalRoot').innerHTML=`<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-3" onclick="if(event.target===this)closeModal()"><div class="surface w-full max-w-2xl max-h-[92vh] overflow-y-auto p-5 md:p-6"><div class="flex justify-between items-center mb-5"><div><h3 class="font-black text-lg">${id?'Edit':'Tambah'} ${s.title}</h3><p class="text-xs text-slate-500 mt-1">Isi informasi di bawah, lalu simpan.</p></div><button class="btn btn-soft" onclick="closeModal()">✕</button></div><form id="recordForm" class="grid sm:grid-cols-2 gap-4">${fields}<div class="sm:col-span-2 flex justify-end gap-2 pt-3 border-t border-slate-100"><button type="button" class="btn btn-soft" onclick="closeModal()">Batal</button><button class="btn btn-primary" type="submit">Simpan Data</button></div></form></div></div>`;
 $('recordForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),obj={id:id||crypto.randomUUID(),updatedAt:new Date().toISOString()};for(const [key,value] of fd)obj[key]=value;let arr=state[k]||[];const ix=arr.findIndex(x=>x.id===id);if(ix>=0)arr[ix]=obj;else arr.unshift(obj);state[k]=arr;persist();closeModal();render();toast('Data berhasil disimpan.')};
}
function closeModal(){$('modalRoot').innerHTML=''}
function removeItem(k,id){if(!confirm('Hapus data ini? Tindakan ini tidak dapat dibatalkan.'))return;state[k]=state[k].filter(x=>x.id!==id);persist();render();toast('Data dihapus.')}
function openQuickAdd(){const opts=Object.entries(schemas).map(([k,s])=>`<button class="btn btn-soft justify-start" onclick="closeModal();go('${k}');openForm('${k}')">${s.title}</button>`).join('');$('modalRoot').innerHTML=`<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()"><div class="surface p-5 w-full max-w-md"><div class="flex justify-between mb-4"><h3 class="font-black">Tambah Data</h3><button onclick="closeModal()">✕</button></div><div class="grid grid-cols-2 gap-2">${opts}</div></div></div>`}
function renderReports(){const totalViews=state.analytics.reduce((a,x)=>a+(+x.views||0),0),totalOrders=state.affiliate.reduce((a,x)=>a+(+x.orders||0),0),commission=state.affiliate.reduce((a,x)=>a+(+x.actual||0),0);$('view').innerHTML=`<div class="surface p-5 mb-4"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-black text-lg">Report Center</h2><p class="text-xs text-slate-500 muted mt-1">Ringkasan seluruh data yang tersimpan pada perangkat ini.</p></div><div class="flex gap-2 flex-wrap"><button class="btn btn-primary" onclick="exportExcel()"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export Excel</button><button class="btn btn-dark" onclick="window.print()"><i data-lucide="printer" class="w-4 h-4"></i> Cetak / PDF</button><button class="btn btn-soft" onclick="exportCSV()"><i data-lucide="download" class="w-4 h-4"></i> Export CSV</button></div></div></div><div class="grid sm:grid-cols-3 gap-3 mb-4">${card('Total Views',num(totalViews),'eye')}${card('Total Pesanan Affiliate',num(totalOrders),'shopping-cart','amber')}${card('Komisi Aktual Cair',money(commission),'wallet','emerald')}</div><div class="surface p-5"><h3 class="font-black mb-3">Isi laporan</h3><p class="text-xs text-slate-500 muted">File Excel berisi sheet terpisah untuk setiap modul: klien, akun, planner, analytics, affiliate, finance, tasks, dan assets. PDF dibuat melalui fitur cetak browser.</p></div>`;if(window.lucide)lucide.createIcons()}
function exportExcel(){if(!window.XLSX){toast('Library Excel belum termuat.');return}const wb=XLSX.utils.book_new();Object.keys(schemas).forEach(k=>{const rows=state[k].map(({id,updatedAt,...r})=>r);XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),k.slice(0,31))});XLSX.writeFile(wb,'BOBY-CREATOR-STUDIO-REPORT.xlsx')}
function exportCSV(){const all=[];Object.keys(schemas).forEach(k=>state[k].forEach(x=>all.push({Modul:k,...x})));const keys=[...new Set(all.flatMap(x=>Object.keys(x)))];const csv=[keys,...all.map(o=>keys.map(k=>o[k]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'BOBY-CREATOR-STUDIO-REPORT.csv')}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function renderSettings(){$('view').innerHTML=`<div class="grid lg:grid-cols-2 gap-4"><div class="surface p-5"><div class="flex gap-3 items-center mb-3"><div class="w-10 h-10 bg-emerald-50 text-emerald-700 rounded-xl grid place-items-center"><i data-lucide="database-backup"></i></div><div><h3 class="font-black">Backup & Restore</h3><p class="text-xs text-slate-500 muted">Simpan salinan semua data sebagai JSON.</p></div></div><p class="text-xs text-slate-500 muted mb-4">Backup dapat dipakai untuk memindahkan data atau memulihkan data pada browser lain. Simpan file backup di tempat aman.</p><div class="flex flex-wrap gap-2"><button class="btn btn-primary" onclick="backup()"><i data-lucide="download" class="w-4 h-4"></i> Download Backup JSON</button><label class="btn btn-soft cursor-pointer"><i data-lucide="upload" class="w-4 h-4"></i> Restore JSON<input type="file" accept=".json,application/json" class="hidden" onchange="restore(event)"></label></div></div><div class="surface p-5"><div class="flex gap-3 items-center mb-3"><div class="w-10 h-10 bg-indigo-50 text-indigo-700 rounded-xl grid place-items-center"><i data-lucide="info"></i></div><div><h3 class="font-black">Status Aplikasi</h3><p class="text-xs text-slate-500 muted">Informasi penyimpanan dan data.</p></div></div><div class="text-xs space-y-2"><div class="flex justify-between"><span class="text-slate-500">Metode penyimpanan</span><b>Browser LocalStorage</b></div><div class="flex justify-between"><span class="text-slate-500">Jumlah seluruh record</span><b>${Object.values(state).reduce((a,x)=>a+x.length,0)}</b></div><div class="flex justify-between"><span class="text-slate-500">Status</span><b class="text-emerald-600">Aktif di perangkat ini</b></div></div><div class="bg-amber-50 text-amber-900 rounded-xl p-3 text-[11px] mt-4 leading-relaxed"><b>Catatan penting:</b> versi HTML satu file ini menyimpan data di browser/perangkat yang digunakan. Belum tersambung ke Firebase atau sinkronisasi antarperangkat. Jangan hapus data browser sebelum membuat backup.</div></div><div class="surface p-5 lg:col-span-2"><h3 class="font-black text-rose-700">Reset Data</h3><p class="text-xs text-slate-500 muted mt-1 mb-3">Hapus seluruh data aplikasi dari browser ini. Pastikan sudah memiliki backup.</p><button class="btn btn-danger" onclick="resetAll()">Hapus Semua Data</button></div></div>`;if(window.lucide)lucide.createIcons()}
function backup(){download(new Blob([JSON.stringify({app:'BOBY CREATOR STUDIO',version:3,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),'BOBY-CREATOR-BACKUP.json');toast('Backup berhasil dibuat.')}
function restore(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),data=parsed.data||parsed;if(!confirm('Pulihkan backup? Data yang ada saat ini akan diganti.'))return;Object.keys(schemas).forEach(k=>state[k]=Array.isArray(data[k])?data[k]:[]);persist();render();toast('Backup berhasil dipulihkan.')}catch(err){alert('File backup tidak valid.')}};reader.readAsText(file)}
function resetAll(){if(!confirm('Yakin menghapus SEMUA data? Buat backup terlebih dahulu.'))return;Object.keys(schemas).forEach(k=>state[k]=[]);persist();render();toast('Semua data telah dihapus.')}
function openFormFromModule(k){go(k);openForm(k)}
document.addEventListener('DOMContentLoaded',()=>{if(localStorage.getItem('boby_theme')==='dark')document.documentElement.classList.add('dark');$('todayLabel').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});refreshNav();render();});
</script>
</body>
</html>
