    // --- STATE & STORAGE KEYS ---
    const STORAGE_KEY = 'BOBY_CREATOR_STUDIO_DB_V1';
    const FIREBASE_CFG_KEY = 'BOBY_CREATOR_STUDIO_FB_CFG';

    // Konfigurasi Default Firebase milik Boby Anggara (Otomatis Aktif)
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBts_aqGp_1EosViZfHink-eJDpV9QAijw",
      authDomain: "boby-creator-studio.firebaseapp.com",
      projectId: "boby-creator-studio",
      storageBucket: "boby-creator-studio.firebasestorage.app",
      messagingSenderId: "133686903556",
      appId: "1:133686903556:web:ff7cf35c3b02fb95860651",
      measurementId: "G-YDEGTXNBT"
    };

    let db = {
      clients: [],
      accounts: [],
      contents: [],
      analytics: [],
      affiliates: [],
      tasks: []
    };

    let activeTab = 'dashboard';
    let dashChartMode = 'weekly';
    let plannerViewMode = 'list';
    let currentCalendarDate = new Date();
    let dashboardChartInstance = null;
    let analyticsChartInstance = null;
    let firestoreDb = null;
    let unsubscribeRealtime = null;
    let isApplyingCloudUpdate = false;

    // --- LOAD INITIAL DATA (LOCAL CACHE FIRST) ---
    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('BOBY_CREATOR_STUDIO_DB_V2');
        if (raw) {
          const parsed = JSON.parse(raw);
          db = {
            clients: Array.isArray(parsed.clients) ? parsed.clients : [],
            accounts: Array.isArray(parsed.accounts) ? parsed.accounts : [],
            contents: Array.isArray(parsed.contents) ? parsed.contents : [],
            analytics: Array.isArray(parsed.analytics) ? parsed.analytics : [],
            affiliates: Array.isArray(parsed.affiliates) ? parsed.affiliates : [],
            tasks: Array.isArray(parsed.tasks) ? parsed.tasks : []
          };
        }
      } catch (err) {
        console.error('Gagal memuat LocalStorage:', err);
      }
    }

    function saveDatabase() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        refreshAllViews();
        if (firestoreDb && !isApplyingCloudUpdate) {
          pushToFirestoreSilent();
        }
      } catch (err) {
        console.error('Gagal menyimpan data:', err);
        showToast('Penyimpanan penuh atau gagal menyimpan!', 'error');
      }
    }

    // --- UTILITIES ---
    function uid() {
      return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
    }

    function todayISO() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function formatNumber(num) {
      return Number(num || 0).toLocaleString('id-ID');
    }

    function formatRupiah(num) {
      return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    }

    function formatDateID(dateStr) {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${parts[2]} ${months[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const bg = type === 'success' ? 'bg-slate-900 text-white border-emerald-500' : 'bg-rose-600 text-white border-rose-300';
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border-l-4 ${bg} text-xs font-bold transition-all`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    // --- NAVIGATION & TAB SWITCHING ---
    const tabMeta = {
      dashboard: { title: 'Dashboard Utama', subtitle: 'Ringkasan seluruh pekerjaan & metrik performa real-time' },
      clients: { title: 'Manajemen Klien', subtitle: 'Kelola daftar klien, brand, status kerja sama, dan ruang lingkup pekerjaan' },
      accounts: { title: 'Manajemen Akun Media Sosial', subtitle: 'Kelola akun TikTok, Instagram, dan Shopee milik klien maupun pribadi' },
      planner: { title: 'Content Planner & Kalender', subtitle: 'Susun jadwal publikasi, ide, pillar, hook, script, caption, dan status produksi' },
      analytics: { title: 'Social Media Analytics', subtitle: 'Hitung Engagement Rate otomatis, grafik performa, dan perbandingan periode' },
      affiliate: { title: 'Affiliate Tracker', subtitle: 'Pantau performa produk affiliate, klik, pesanan, Conversion Rate, GMV, dan komisi' },
      tasks: { title: 'Task Management', subtitle: 'Daftar pekerjaan harian, prioritas, dan pengingat deadline otomatis' },
      reports: { title: 'Report Center', subtitle: 'Laporan mingguan, bulanan, per klien, serta Export PDF, Excel, dan CSV' },
      settings: { title: 'Database, Backup & Firebase', subtitle: 'Pengaturan penyimpanan lokal browser dan koneksi Cloud Firestore' }
    };

    window.switchTab = function(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.add('hidden'));
      const target = document.getElementById(`sec-${tabName}`);
      if (target) target.classList.remove('hidden');

      const meta = tabMeta[tabName] || tabMeta.dashboard;
      document.getElementById('page-title').textContent = meta.title;
      document.getElementById('page-subtitle').textContent = meta.subtitle;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.className = 'nav-btn w-full flex items-center justify-between gap-3 px-3.5 py-3 rounded-xl text-sm font-bold bg-indigo-600 text-white shadow-sm transition-all';
        } else {
          btn.className = 'nav-btn w-full flex items-center justify-between gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition-all';
        }
      });

      document.querySelectorAll('.mob-nav-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.className = 'mob-nav-btn flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[11px] font-extrabold text-indigo-600 transition';
        } else {
          btn.className = 'mob-nav-btn flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[11px] font-semibold text-slate-500 transition';
        }
      });

      refreshAllViews();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.toggleMobileMoreSheet = function(show) {
      const sheet = document.getElementById('mobile-more-sheet');
      if (show) sheet.classList.remove('hidden');
      else sheet.classList.add('hidden');
    };

    // --- MODALS & CONFIRMATION ---
    window.closeModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    };

    function askDeleteConfirmation(message, onConfirm) {
      document.getElementById('confirm-message').textContent = message;
      const modal = document.getElementById('modal-confirm');
      modal.classList.remove('hidden');
      const yesBtn = document.getElementById('btn-confirm-yes');
      yesBtn.onclick = () => {
        modal.classList.add('hidden');
        onConfirm();
      };
    }

    function populateClientSelects() {
      const selects = ['account-client', 'content-client', 'analytics-client', 'report-client'];
      selects.forEach(selectId => {
        const el = document.getElementById(selectId);
        if (!el) return;
        const currentVal = el.value;
        if (selectId === 'report-client') {
          el.innerHTML = `<option value="ALL">Semua Klien & Proyek Pribadi</option><option value="Pribadi / Internal">Pribadi / Internal</option>`;
        } else {
          el.innerHTML = `<option value="Pribadi / Internal">Pribadi / Internal</option>`;
        }
        db.clients.forEach(c => {
          const label = `${escapeHtml(c.name)} (${escapeHtml(c.brand)})`;
          el.innerHTML += `<option value="${escapeHtml(c.name)}">${label}</option>`;
        });
        if (currentVal) el.value = currentVal;
      });
    }

    // ==================== 1. DASHBOARD RENDERING ====================
    window.setDashboardChartMode = function(mode) {
      dashChartMode = mode;
      const btnW = document.getElementById('btn-chart-weekly');
      const btnM = document.getElementById('btn-chart-monthly');
      if (mode === 'weekly') {
        btnW.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition';
        btnM.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition';
      } else {
        btnM.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition';
        btnW.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition';
      }
      renderDashboardChart();
    };

    function renderDashboard() {
      const totalClients = db.clients.length;
      const activeClients = db.clients.filter(c => c.status === 'Aktif').length;
      const totalAccounts = db.accounts.length;
      const totalContents = db.contents.length;
      const uploadedContents = db.contents.filter(c => c.status === 'Sudah upload').length;
      const readyUploadContents = db.contents.filter(c => c.status === 'Siap upload').length;

      const totalViews = db.analytics.reduce((acc, a) => acc + Number(a.views || 0), 0);
      const baseFollowers = db.accounts.reduce((acc, a) => acc + Number(a.followers || 0), 0);
      const gainedFollowers = db.analytics.reduce((acc, a) => acc + Number(a.followersGained || 0), 0);

      let avgER = 0;
      if (db.analytics.length > 0) {
        const sumER = db.analytics.reduce((acc, a) => acc + Number(a.er || 0), 0);
        avgER = sumER / db.analytics.length;
      }

      const affClicks = db.affiliates.reduce((acc, f) => acc + Number(f.clicks || 0), 0);
      const affOrders = db.affiliates.reduce((acc, f) => acc + Number(f.orders || 0), 0);
      const affGMV = db.affiliates.reduce((acc, f) => acc + Number(f.gmv || 0), 0);
      const affComm = db.affiliates.reduce((acc, f) => acc + Number(f.commission || 0), 0);
      const affCR = affClicks > 0 ? ((affOrders / affClicks) * 100) : 0;

      document.getElementById('dash-total-clients').textContent = formatNumber(totalClients);
      document.getElementById('dash-active-clients').textContent = `${formatNumber(activeClients)} Klien Aktif`;
      document.getElementById('dash-total-accounts').textContent = formatNumber(totalAccounts);
      document.getElementById('dash-total-content').textContent = formatNumber(totalContents);
      document.getElementById('dash-uploaded-content').textContent = `${formatNumber(uploadedContents)} Sudah Upload`;
      document.getElementById('dash-total-views').textContent = formatNumber(totalViews);
      document.getElementById('dash-total-followers').textContent = formatNumber(baseFollowers + gainedFollowers);
      document.getElementById('dash-followers-growth').textContent = `+${formatNumber(gainedFollowers)} dari Konten`;
      document.getElementById('dash-avg-er').textContent = `${avgER.toFixed(2)}%`;
      document.getElementById('dash-aff-clicks').textContent = formatNumber(affClicks);
      document.getElementById('dash-aff-cr').textContent = `CR: ${affCR.toFixed(2)}%`;
      document.getElementById('dash-aff-orders').textContent = formatNumber(affOrders);
      document.getElementById('dash-aff-gmv').textContent = `GMV: ${formatRupiah(affGMV)}`;
      document.getElementById('dash-aff-commission').textContent = formatRupiah(affComm);
      document.getElementById('dash-ready-upload-count').textContent = `${readyUploadContents} Konten`;

      const upcomingContainer = document.getElementById('dash-upcoming-list');
      const pendingTasks = db.tasks
        .filter(t => t.status !== 'Selesai')
        .sort((a, b) => (a.deadline || '').localeCompare(b.deadline || ''));

      if (pendingTasks.length === 0) {
        upcomingContainer.innerHTML = `
          <div class="p-4 rounded-xl bg-slate-50 border border-dashed border-slate-200 text-center">
            <p class="text-xs font-semibold text-slate-600">Tidak Ada Tugas Tertunda</p>
            <p class="text-[11px] text-slate-400 mt-0.5">Tambahkan pekerjaan di menu Task Management untuk memantau deadline.</p>
          </div>`;
      } else {
        upcomingContainer.innerHTML = pendingTasks.slice(0, 5).map(t => {
          const badge = getDeadlineStatusBadge(t.deadline, t.status);
          return `
            <div class="p-3 rounded-xl border border-slate-200/80 hover:bg-slate-50 flex items-start justify-between gap-2">
              <div class="min-w-0">
                <p class="text-xs font-bold text-slate-900 truncate">${escapeHtml(t.title)}</p>
                <p class="text-[11px] text-slate-500 mt-0.5">Deadline: ${formatDateID(t.deadline)} • Prioritas ${escapeHtml(t.priority)}</p>
              </div>
              ${badge}
            </div>`;
        }).join('');
      }

      renderDashboardChart();
    }

    function renderDashboardChart() {
      const emptyOverlay = document.getElementById('dashboard-chart-empty');
      const ctx = document.getElementById('dashboardChart');
      if (!ctx) return;

      if (db.analytics.length === 0) {
        emptyOverlay.classList.remove('hidden');
        if (dashboardChartInstance) {
          dashboardChartInstance.destroy();
          dashboardChartInstance = null;
        }
        return;
      }
      emptyOverlay.classList.add('hidden');

      const sorted = [...db.analytics].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      let labels = [];
      let viewsData = [];
      let erData = [];

      if (dashChartMode === 'weekly') {
        const recent = sorted.slice(-7);
        labels = recent.map(item => `${formatDateID(item.date).slice(0, 6)} (${item.title.slice(0, 10)}...)`);
        viewsData = recent.map(item => Number(item.views || 0));
        erData = recent.map(item => Number(item.er || 0));
      } else {
        const monthMap = {};
        sorted.forEach(item => {
          const ym = (item.date || '').slice(0, 7) || 'Lainnya';
          if (!monthMap[ym]) monthMap[ym] = { views: 0, erSum: 0, count: 0 };
          monthMap[ym].views += Number(item.views || 0);
          monthMap[ym].erSum += Number(item.er || 0);
          monthMap[ym].count += 1;
        });
        labels = Object.keys(monthMap);
        viewsData = labels.map(k => monthMap[k].views);
        erData = labels.map(k => Number((monthMap[k].erSum / monthMap[k].count).toFixed(2)));
      }

      if (dashboardChartInstance) dashboardChartInstance.destroy();
      dashboardChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'Total Views',
              data: viewsData,
              backgroundColor: 'rgba(79, 70, 229, 0.85)',
              borderRadius: 8,
              yAxisID: 'y'
            },
            {
              label: 'Engagement Rate (%)',
              data: erData,
              type: 'line',
              borderColor: '#f43f5e',
              backgroundColor: '#f43f5e',
              borderWidth: 2.5,
              tension: 0.35,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } }
          },
          scales: {
            y: { type: 'linear', position: 'left', beginAtZero: true, grid: { color: '#f1f5f9' } },
            y1: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
          }
        }
      });
    }

    // ==================== 2. CLIENTS CRUD ====================
    window.openClientModal = function(id = null) {
      document.getElementById('client-id').value = '';
      document.getElementById('client-name').value = '';
      document.getElementById('client-brand').value = '';
      document.getElementById('client-date').value = todayISO();
      document.getElementById('client-status').value = 'Aktif';
      document.getElementById('client-notes').value = '';
      document.getElementById('modal-client-title').textContent = 'Tambah Klien Baru';

      if (id) {
        const c = db.clients.find(x => x.id === id);
        if (c) {
          document.getElementById('client-id').value = c.id;
          document.getElementById('client-name').value = c.name;
          document.getElementById('client-brand').value = c.brand;
          document.getElementById('client-date').value = c.startDate;
          document.getElementById('client-status').value = c.status;
          document.getElementById('client-notes').value = c.notes || '';
          document.getElementById('modal-client-title').textContent = 'Edit Data Klien';
        }
      }
      document.getElementById('modal-client').classList.remove('hidden');
    };

    window.saveClient = function(e) {
      e.preventDefault();
      const id = document.getElementById('client-id').value;
      const payload = {
        id: id || uid(),
        name: document.getElementById('client-name').value.trim(),
        brand: document.getElementById('client-brand').value.trim(),
        startDate: document.getElementById('client-date').value,
        status: document.getElementById('client-status').value,
        notes: document.getElementById('client-notes').value.trim()
      };

      if (id) {
        const idx = db.clients.findIndex(x => x.id === id);
        if (idx > -1) db.clients[idx] = payload;
        showToast('Data klien berhasil diperbarui!');
      } else {
        db.clients.unshift(payload);
        showToast('Klien baru berhasil ditambahkan!');
      }
      closeModal('modal-client');
      saveDatabase();
    };

    window.deleteClient = function(id) {
      const c = db.clients.find(x => x.id === id);
      askDeleteConfirmation(`Hapus klien "${c ? c.name : ''}" beserta catatannya?`, () => {
        db.clients = db.clients.filter(x => x.id !== id);
        saveDatabase();
        showToast('Klien berhasil dihapus');
      });
    };

    window.renderClients = function() {
      const q = (document.getElementById('search-clients')?.value || '').toLowerCase();
      const statusFilter = document.getElementById('filter-clients-status')?.value || 'ALL';

      const filtered = db.clients.filter(c => {
        const matchQ = c.name.toLowerCase().includes(q) || c.brand.toLowerCase().includes(q) || (c.notes || '').toLowerCase().includes(q);
        const matchS = statusFilter === 'ALL' || c.status === statusFilter;
        return matchQ && matchS;
      });

      const tbody = document.getElementById('clients-table-body');
      const mobileCards = document.getElementById('clients-mobile-cards');
      const empty = document.getElementById('clients-empty');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        mobileCards.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const statusBadge = (st) => {
        const map = {
          'Aktif': 'bg-emerald-50 text-emerald-700 border-emerald-200',
          'Prospek / Negosiasi': 'bg-amber-50 text-amber-700 border-amber-200',
          'Jeda': 'bg-slate-100 text-slate-700 border-slate-300',
          'Selesai': 'bg-rose-50 text-rose-700 border-rose-200'
        };
        return `<span class="px-2.5 py-1 rounded-full text-xs font-bold border ${map[st] || map['Aktif']}">${escapeHtml(st)}</span>`;
      };

      tbody.innerHTML = filtered.map(c => `
        <tr class="hover:bg-slate-50/80">
          <td class="py-3.5 px-5">
            <p class="font-bold text-slate-900">${escapeHtml(c.name)}</p>
            <p class="text-xs text-indigo-600 font-semibold">${escapeHtml(c.brand)}</p>
          </td>
          <td class="py-3.5 px-4 text-slate-600 text-xs font-medium">${formatDateID(c.startDate)}</td>
          <td class="py-3.5 px-4">${statusBadge(c.status)}</td>
          <td class="py-3.5 px-4 text-xs text-slate-600 max-w-xs truncate">${escapeHtml(c.notes || '-')}</td>
          <td class="py-3.5 px-5 text-right space-x-1">
            <button onclick="openClientModal('${c.id}')" class="px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-100">Edit</button>
            <button onclick="deleteClient('${c.id}')" class="px-2.5 py-1.5 rounded-lg border border-rose-200 text-xs font-bold text-rose-600 hover:bg-rose-50">Hapus</button>
          </td>
        </tr>
      `).join('');

      mobileCards.innerHTML = filtered.map(c => `
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-2.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h4 class="font-bold text-slate-900 text-sm">${escapeHtml(c.name)}</h4>
              <p class="text-xs font-semibold text-indigo-600">${escapeHtml(c.brand)}</p>
            </div>
            ${statusBadge(c.status)}
          </div>
          <p class="text-xs text-slate-600">${escapeHtml(c.notes || 'Tidak ada catatan khusus.')}</p>
          <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
            <span>Mulai: ${formatDateID(c.startDate)}</span>
            <div class="space-x-1.5">
              <button onclick="openClientModal('${c.id}')" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-700 font-bold">Edit</button>
              <button onclick="deleteClient('${c.id}')" class="px-3 py-1 rounded-lg bg-rose-50 text-rose-600 font-bold">Hapus</button>
            </div>
          </div>
        </div>
      `).join('');
    };

          document.getElementById('account-username').value = a.username;

      document.getElementById('modal-account').classList.remove('hidden');

    window.saveAccount = function(e) {
      e.preventDefault();
      const id = document.getElementById('account-id').value;
      const payload = {
        id: id || uid(),
        name: document.getElementById('account-name').value.trim(),
        username: document.getElementById('account-username').value.trim(),
        platform: document.getElementById('account-platform').value,
        client: document.getElementById('account-client').value,
        followers: Number(document.getElementById('account-followers').value || 0),
        notes: document.getElementById('account-notes').value.trim()
      };

      if (id) {
        const idx = db.accounts.findIndex(x => x.id === id);
        if (idx > -1) db.accounts[idx] = payload;
        showToast('Akun media sosial diperbarui!');
      } else {
        db.accounts.unshift(payload);

    function renderPlannerCalendar() {
      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();
      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      document.getElementById('calendar-month-label').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendar-grid');
      let html = '';

      for (let i = 0; i < firstDay; i++) {
        html += `<div class="min-h-[80px] sm:min-h-[105px] rounded-xl bg-slate-50/60 border border-slate-100"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const items = db.contents.filter(c => c.date === dateStr);
        const isToday = dateStr === todayISO();

        html += `
          <div onclick="openContentModal(null, '${dateStr}')" class="min-h-[80px] sm:min-h-[105px] p-1.5 sm:p-2 rounded-xl border ${isToday ? 'border-indigo-500 bg-indigo-50/20' : 'border-slate-200 bg-white'} hover:border-indigo-400 transition cursor-pointer flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold ${isToday ? 'bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center' : 'text-slate-700'}">${d}</span>
              ${items.length > 0 ? `<span class="text-[10px] font-bold text-indigo-600">${items.length}</span>` : ''}
            </div>
            <div class="space-y-1 mt-1 overflow-hidden">
              ${items.slice(0, 2).map(it => `
                <div onclick="event.stopPropagation(); openContentModal('${it.id}')" class="px-1.5 py-0.5 rounded text-[10px] font-semibold truncate ${getStatusColorClass(it.status)}">
                  ${escapeHtml(it.title)}
                </div>
              `).join('')}
              ${items.length > 2 ? `<p class="text-[9px] text-slate-400 font-bold">+${items.length - 2} lagi</p>` : ''}
            </div>
          </div>`;
      }
      grid.innerHTML = html;
    }

    window.renderAnalytics = function() {
      const q = (document.getElementById('search-analytics')?.value || '').toLowerCase();
      const pf = document.getElementById('filter-analytics-platform')?.value || 'ALL';

      const filtered = db.analytics.filter(a => {
        const matchQ = a.title.toLowerCase().includes(q) || (a.client || '').toLowerCase().includes(q);
        const matchP = pf === 'ALL' || a.platform === pf;
        return matchQ && matchP;
      });

      const bestBox = document.getElementById('analytics-best-box');
      const lowBox = document.getElementById('analytics-lowest-box');
      const compBox = document.getElementById('analytics-comparison-box');

      if (db.analytics.length > 0) {
        const sortedByViews = [...db.analytics].sort((a, b) => b.views - a.views);
        const best = sortedByViews[0];
        const low = sortedByViews[sortedByViews.length - 1];

        bestBox.innerHTML = `
          <p class="font-bold text-slate-900 text-sm truncate">${escapeHtml(best.title)}</p>
          <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(best.platform)} • ${formatDateID(best.date)}</p>

        lowBox.innerHTML = `

            <span>${formatNumber(low.views)} Views</span>
            <span>ER: ${low.er}%</span>

        const now = new Date();
        const curYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    // ==================== 7. TASK MANAGEMENT & DEADLINE REMINDER ====================
    function getDeadlineDiffDays(deadlineStr) {
      if (!deadlineStr) return 999;
      const today = new Date(todayISO());
      const target = new Date(deadlineStr);
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function getDeadlineStatusBadge(deadlineStr, status) {
      if (status === 'Selesai') {
        return `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700">Selesai</span>`;
      }
      const diff = getDeadlineDiffDays(deadlineStr);
      if (diff < 0) {
        return `<span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-rose-100 text-rose-700">Terlambat (${Math.abs(diff)} hr)</span>`;
      }
      if (diff === 0) {
        return `<span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-amber-100 text-amber-800">Hari Ini!</span>`;
      }
      if (diff <= 3) {
        return `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-50 text-amber-700">${diff} Hari Lagi</span>`;
      }
      return `<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600">${diff} Hari Lagi</span>`;
    }

    function updateDeadlineReminders() {
      const urgentTasks = db.tasks.filter(t => t.status !== 'Selesai' && getDeadlineDiffDays(t.deadline) <= 2);
      const count = urgentTasks.length;

      const sideBadge = document.getElementById('sidebar-task-badge');
      const headerAlert = document.getElementById('header-deadline-alert');
      const headerText = document.getElementById('header-deadline-text');
      const banner = document.getElementById('urgent-reminder-banner');
      const bannerMsg = document.getElementById('urgent-reminder-message');
      const mobDot = document.getElementById('mob-more-badge');

      if (count > 0) {
        sideBadge.textContent = count;
        sideBadge.classList.remove('hidden');
        headerAlert.classList.remove('hidden');
        headerAlert.classList.add('inline-flex');
        headerText.textContent = `${count} Deadline Dekat`;
        banner.classList.remove('hidden');
        bannerMsg.textContent = `Pengingat Deadline: Kamu memiliki ${count} pekerjaan penting yang jatuh tempo dalam ≤ 2 hari atau sudah lewat waktu!`;
        mobDot.classList.remove('hidden');
      } else {
        sideBadge.classList.add('hidden');
        headerAlert.classList.add('hidden');
        headerAlert.classList.remove('inline-flex');
        banner.classList.add('hidden');
        mobDot.classList.add('hidden');
      }
    }

    // ==================== 8. REPORT CENTER & EXPORT ====================
    function getFilteredReportData() {
      const period = document.getElementById('report-period')?.value || 'monthly';
      const client = document.getElementById('report-client')?.value || 'ALL';
      const now = new Date(todayISO());
      const daysLimit = period === 'weekly' ? 7 : (period === 'monthly' ? 30 : 99999);

      const withinDays = (dateStr) => {
        if (!dateStr || daysLimit === 99999) return true;
        const diff = Math.round((now - new Date(dateStr)) / (1000 * 60 * 60 * 24));
        return diff >= 0 && diff <= daysLimit;
      };

      const perf = db.analytics.filter(a => withinDays(a.date) && (client === 'ALL' || a.client === client));
      const aff = db.affiliates.filter(f => withinDays(f.date));
      const contents = db.contents.filter(c => withinDays(c.date) && (client === 'ALL' || c.client === client));

      return { perf, aff, contents, period, client };
    }

    window.renderReportCenter = function() {
      const { perf, aff, contents, period, client } = getFilteredReportData();
      const reportType = document.getElementById('report-type')?.value || 'all';

      const periodName = period === 'weekly' ? 'Mingguan (7 Hari Terakhir)' : (period === 'monthly' ? 'Bulanan (30 Hari Terakhir)' : 'Seluruh Periode');
      document.getElementById('report-header-title').textContent = `Laporan Performa ${periodName}`;
      document.getElementById('report-header-meta').textContent = `Filter Klien: ${client === 'ALL' ? 'Semua Klien & Proyek' : client} • Disusun oleh Boby Anggara`;
      document.getElementById('report-date-badge').textContent = `Tanggal Cetak: ${formatDateID(todayISO())}`;

      const totalViews = perf.reduce((s, x) => s + Number(x.views || 0), 0);
      const avgER = perf.length > 0 ? (perf.reduce((s, x) => s + Number(x.er || 0), 0) / perf.length).toFixed(2) : '0.00';
      const totalFollowers = perf.reduce((s, x) => s + Number(x.followersGained || 0), 0);
      const totalComm = aff.reduce((s, x) => s + Number(x.commission || 0), 0);

      document.getElementById('rep-kpi-content').textContent = `${contents.length} Konten`;
      document.getElementById('rep-kpi-views').textContent = `${formatNumber(totalViews)} (${avgER}%)`;
      document.getElementById('rep-kpi-followers').textContent = `+${formatNumber(totalFollowers)}`;
      document.getElementById('rep-kpi-commission').textContent = formatRupiah(totalComm);

      const secPerf = document.getElementById('rep-sec-performance');
      const secAff = document.getElementById('rep-sec-affiliate');
      secPerf.classList.toggle('hidden', reportType === 'affiliate');
      secAff.classList.toggle('hidden', reportType === 'performance');

      const perfBody = document.getElementById('rep-table-performance');
      perfBody.innerHTML = perf.length === 0
        ? `<tr><td colspan="7" class="py-4 text-center text-slate-400">Belum ada data performa pada periode ini.</td></tr>`
        : perf.map(p => `
            <tr>
              <td class="py-2 px-3">${formatDateID(p.date)}</td>
              <td class="py-2 px-3 font-bold text-slate-900">${escapeHtml(p.title)}</td>
              <td class="py-2 px-3">${escapeHtml(p.platform)}</td>
              <td class="py-2 px-3">${formatNumber(p.views)}</td>
              <td class="py-2 px-3">${formatNumber(p.reach)}</td>
              <td class="py-2 px-3">${formatNumber(p.engagement)}</td>
              <td class="py-2 px-3 font-bold text-indigo-600">${p.er}%</td>
            </tr>`).join('');

      const affBody = document.getElementById('rep-table-affiliate');
      affBody.innerHTML = aff.length === 0
        ? `<tr><td colspan="8" class="py-4 text-center text-slate-400">Belum ada data affiliate pada periode ini.</td></tr>`
        : aff.map(f => `
            <tr>
              <td class="py-2 px-3">${formatDateID(f.date)}</td>
              <td class="py-2 px-3 font-bold text-slate-900">${escapeHtml(f.product)}</td>
              <td class="py-2 px-3">${escapeHtml(f.platform)}</td>
              <td class="py-2 px-3">${formatNumber(f.clicks)}</td>
              <td class="py-2 px-3">${formatNumber(f.orders)}</td>
              <td class="py-2 px-3 font-bold text-amber-600">${f.cr}%</td>
              <td class="py-2 px-3">${formatRupiah(f.gmv)}</td>
              <td class="py-2 px-3 font-bold text-emerald-600">${formatRupiah(f.commission)}</td>
            </tr>`).join('');
    };

    window.exportReportPDF = function() {
      window.print();
    };

    window.exportReportCSV = function() {
      const { perf, aff } = getFilteredReportData();
      let csv = 'KATEGORI,TANGGAL,NAMA KONTEN / PRODUK,PLATFORM,VIEWS / KLIK,REACH / PESANAN,ER (%) / CR (%),FOLLOWERS / KOMISI (RP)\n';
      perf.forEach(p => {
        csv += `"Analitik Konten","${p.date}","${p.title.replace(/"/g, '""')}","${p.platform}",${p.views},${p.reach},${p.er},${p.followersGained}\n`;
      });
      aff.forEach(f => {
        csv += `"Affiliate","${f.date}","${f.product.replace(/"/g, '""')}","${f.platform}",${f.clicks},${f.orders},${f.cr},${f.commission}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Laporan_Boby_Creator_Studio_${todayISO()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Laporan CSV berhasil diunduh!');
    };

    window.exportReportExcel = function() {
      const content = document.getElementById('printable-report-area').innerHTML;
      const html = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
        <head><meta charset="UTF-8"></head>
        <body>${content}</body></html>`;
      const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Laporan_Boby_Creator_Studio_${todayISO()}.xls`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Laporan Excel (.xls) berhasil diunduh!');
    };

    // ==================== 9. BACKUP & REALTIME FIREBASE CONNECTOR ====================
    window.downloadBackupJSON = function() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Backup_BobyCreatorStudio_${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('File Backup (.json) berhasil diunduh!');
    };

    window.restoreBackupJSON = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && typeof parsed === 'object') {
            db = {
              clients: Array.isArray(parsed.clients) ? parsed.clients : [],
              accounts: Array.isArray(parsed.accounts) ? parsed.accounts : [],
              contents: Array.isArray(parsed.contents) ? parsed.contents : [],
              analytics: Array.isArray(parsed.analytics) ? parsed.analytics : [],
              affiliates: Array.isArray(parsed.affiliates) ? parsed.affiliates : [],
              tasks: Array.isArray(parsed.tasks) ? parsed.tasks : []
            };
            saveDatabase();
            showToast('Data backup berhasil dipulihkan!');
          }
        } catch (err) {
          showToast('File backup tidak valid!', 'error');
        }
      };
      reader.readAsText(file);
    };

    window.confirmResetAllData = function() {
      askDeleteConfirmation('Apakah kamu yakin ingin menghapus seluruh data di browser ini hingga bersih?', () => {
        db = { clients: [], accounts: [], contents: [], analytics: [], affiliates: [], tasks: [] };
        saveDatabase();
        showToast('Seluruh data berhasil dibersihkan');
      });
    };

    async function initFirebaseIfConfigured() {
      let cfg = DEFAULT_FIREBASE_CONFIG;
      const rawCfg = localStorage.getItem(FIREBASE_CFG_KEY);
      if (rawCfg) {
        try {
          const parsed = JSON.parse(rawCfg);
          if (parsed && parsed.apiKey && parsed.projectId) {
            cfg = parsed;
          }
        } catch (e) {}
      }

      if (document.getElementById('fb-apiKey')) document.getElementById('fb-apiKey').value = cfg.apiKey || '';
      if (document.getElementById('fb-projectId')) document.getElementById('fb-projectId').value = cfg.projectId || '';
      if (document.getElementById('fb-authDomain')) document.getElementById('fb-authDomain').value = cfg.authDomain || '';
      if (document.getElementById('fb-appId')) document.getElementById('fb-appId').value = cfg.appId || '';

      try {
        const app = initializeApp(cfg);
        firestoreDb = getFirestore(app);
        const docRef = doc(firestoreDb, 'bobyStudioWorkspace', 'mainData');

        // Pasang Realtime Listener (onSnapshot) agar perubahan di HP/Laptop langsung sinkron otomatis
        if (unsubscribeRealtime) unsubscribeRealtime();
        unsubscribeRealtime = onSnapshot(docRef, (snap) => {
          if (snap.exists()) {
            const cloudData = snap.data();
            if (cloudData && cloudData.payload) {
              isApplyingCloudUpdate = true;
              const parsed = JSON.parse(cloudData.payload);
              db = {
                clients: Array.isArray(parsed.clients) ? parsed.clients : [],
                accounts: Array.isArray(parsed.accounts) ? parsed.accounts : [],
                contents: Array.isArray(parsed.contents) ? parsed.contents : [],
                analytics: Array.isArray(parsed.analytics) ? parsed.analytics : [],
                affiliates: Array.isArray(parsed.affiliates) ? parsed.affiliates : [],
                tasks: Array.isArray(parsed.tasks) ? parsed.tasks : []
              };
              localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
              refreshAllViews();
              isApplyingCloudUpdate = false;
            }
          } else {
            pushToFirestoreSilent();
          }
          setStorageStatusUI(true);
        }, (err) => {
          console.error('Error Realtime Firestore:', err);
          setStorageStatusUI(false);
          showToast('Koneksi Cloud tertolak: Cek tab Rules di Firebase Console', 'error');
        });
      } catch (err) {
        console.warn('Koneksi Firebase belum aktif:', err);
        setStorageStatusUI(false);
      }
    }

    async function pushToFirestoreSilent() {
      if (!firestoreDb) return;
      try {
        await setDoc(doc(firestoreDb, 'bobyStudioWorkspace', 'mainData'), {
          payload: JSON.stringify(db),
          updatedAt: new Date().toISOString()
        });
        setStorageStatusUI(true);
      } catch (err) {
        console.warn('Gagal sinkronisasi ke Firestore:', err);
      }
    }

    window.saveFirebaseConfig = async function(e) {
      e.preventDefault();
      const cfg = {
        apiKey: document.getElementById('fb-apiKey').value.trim(),
        projectId: document.getElementById('fb-projectId').value.trim(),
        authDomain: document.getElementById('fb-authDomain').value.trim(),
        appId: document.getElementById('fb-appId').value.trim()
      };
      if (!cfg.apiKey || !cfg.projectId) {
        showToast('API Key dan Project ID wajib diisi!', 'error');
        return;
      }
      localStorage.setItem(FIREBASE_CFG_KEY, JSON.stringify(cfg));
      showToast('Menghubungkan ke Firebase Firestore...');
      await initFirebaseIfConfigured();
    };

    window.syncWithFirebaseNow = async function() {
      await pushToFirestoreSilent();
      showToast('Data berhasil disinkronkan ke Cloud Firestore!');
    };

    window.disconnectFirebase = function() {
      if (unsubscribeRealtime) unsubscribeRealtime();
      localStorage.removeItem(FIREBASE_CFG_KEY);
      firestoreDb = null;
      setStorageStatusUI(false);
      showToast('Koneksi Firebase diputuskan. Kembali ke mode Lokal.');
    };

    function setStorageStatusUI(isCloud) {
      const fbBadge = document.getElementById('firebase-status-badge');
      const syncBtn = document.getElementById('btn-firebase-sync');
      const headerLabel = document.getElementById('header-storage-label');
      const headerDot = document.getElementById('header-storage-dot');
      const deskBadge = document.getElementById('storage-badge-desktop');
      const deskDesc = document.getElementById('storage-desc-desktop');

      if (isCloud) {
        if (fbBadge) {
          fbBadge.textContent = 'Terhubung ke Cloud Firestore';
          fbBadge.className = 'px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700';
        }
        if (syncBtn) syncBtn.classList.remove('hidden');
        if (headerLabel) headerLabel.textContent = 'Cloud + Lokal Aktif';
        if (headerDot) headerDot.className = 'w-2 h-2 rounded-full bg-sky-500';
        if (deskBadge) deskBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span> Cloud + Lokal`;
        if (deskDesc) deskDesc.textContent = 'Data tersimpan di browser dan tersinkronisasi realtime ke Firebase Firestore.';
      } else {
        if (fbBadge) {
          fbBadge.textContent = 'Belum Terhubung (Mode Lokal)';
          fbBadge.className = 'px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600';
        }
        if (syncBtn) syncBtn.classList.add('hidden');
        if (headerLabel) headerLabel.textContent = 'Penyimpanan Lokal';
        if (headerDot) headerDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        if (deskBadge) deskBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Lokal Aktif`;
        if (deskDesc) deskDesc.textContent = 'Tersimpan otomatis di perangkat ini. Aman saat di-refresh.';
      }
    }

    // --- REFRESH ALL VIEWS ---
    function refreshAllViews() {
      populateClientSelects();
      updateDeadlineReminders();
      renderDashboard();
      renderClients();
      renderAccounts();
      renderPlanner();
      renderAnalytics();
      renderAffiliate();
      renderTasks();
      renderReportCenter();
      if (window.lucide) window.lucide.createIcons();
    }

    // --- INITIALIZE APP ---
    window.addEventListener('DOMContentLoaded', () => {
      loadDatabase();
      switchTab('dashboard');
      initFirebaseIfConfigured();
    });
  </script>
</body>
